services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Name the built image so Docker reuses the cached layers across rebuilds.
    image: p2-usd-fat32-fs-dev:local
    volumes:
      - ..:/workspaces/P2-uSD-FAT32-FS:cached
      # Persist todo-mcp task data across container rebuilds.
      - todo-mcp-data:/home/node/.local/share/todo-mcp
    command: sleep infinity
    # Note: postCreateCommand, extensions, and settings are handled in
    # devcontainer.json, not here. Tooling (pnut-ts, Claude CLI) is baked
    # into the image via Dockerfile.

volumes:
  todo-mcp-data:
