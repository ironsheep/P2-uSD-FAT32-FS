name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Parse major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          # Format as 2-digit each: v1.0.0 -> 010000, v0.11.22 -> 001122
          VERSION_CODE=$(printf "%02d%02d%02d" "$MAJOR" "$MINOR" "$PATCH")
          FOLDER_NAME="sd-card-driver-${VERSION_CODE}"
          echo "TAG=v${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "FOLDER_NAME=${FOLDER_NAME}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          VERSION_NUM="${TAG#v}"
          NOTES=$(awk -v ver="$VERSION_NUM" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build release package
        run: |
          DEST="${{ steps.version.outputs.FOLDER_NAME }}"

          # Root files
          mkdir -p "${DEST}"
          cp .release/README.md "${DEST}/README.md"
          cp LICENSE "${DEST}/"
          cp CHANGELOG.md "${DEST}/"
          cp DOCs/SD-CARD-DRIVER-TUTORIAL.md "${DEST}/"

          # DOCs/ - reference documentation
          mkdir -p "${DEST}/DOCs"
          cp DOCs/SD-CARD-DRIVER-THEORY.md "${DEST}/DOCs/"
          cp DOCs/SD-CARD-PERFORMANCE.md "${DEST}/DOCs/"
          cp DOCs/SD-CARD-UTILITIES.md "${DEST}/DOCs/"
          cp DOCs/CONDITIONAL-COMPILATION-GUIDE.md "${DEST}/DOCs/"
          cp DOCs/MIGRATION-GUIDE-v1.2.0.md "${DEST}/DOCs/"

          # DOCs/images/ - card photos for purchase recommendations
          mkdir -p "${DEST}/DOCs/images"
          cp DOCs/images/amazon-basics-2x-64gb.jpg "${DEST}/DOCs/images/"
          cp DOCs/images/favorite-holder.jpg "${DEST}/DOCs/images/"
          cp DOCs/images/lexar-blue-128gb.jpg "${DEST}/DOCs/images/"
          cp DOCs/images/lexar-red-2x-64gb.jpg "${DEST}/DOCs/images/"
          cp DOCs/images/lexar-red-5x-32gb.jpg "${DEST}/DOCs/images/"
          cp DOCs/images/samsug-pro-128gb.jpg "${DEST}/DOCs/images/"
          cp DOCs/images/wd-purple-64gb.jpg "${DEST}/DOCs/images/"

          # src/ - driver and support libraries
          mkdir -p "${DEST}/src"
          cp .release/src/README.md "${DEST}/src/README.md"
          cp src/micro_sd_fat32_fs.spin2 "${DEST}/src/"
          cp src/isp_stack_check.spin2 "${DEST}/src/"

          # src/DEMO/ - demo shell and support files
          mkdir -p "${DEST}/src/DEMO"
          cp .release/src/DEMO/README.md "${DEST}/src/DEMO/README.md"
          cp src/DEMO/SD_demo_shell.spin2 "${DEST}/src/DEMO/"
          cp src/DEMO/isp_serial_singleton.spin2 "${DEST}/src/DEMO/"
          cp src/DEMO/isp_mem_strings.spin2 "${DEST}/src/DEMO/"

          # src/EXAMPLES/ - compilable example programs
          mkdir -p "${DEST}/src/EXAMPLES"
          cp .release/src/EXAMPLES/README.md "${DEST}/src/EXAMPLES/README.md"
          cp src/EXAMPLES/SD_example_read_write.spin2 "${DEST}/src/EXAMPLES/"
          cp src/EXAMPLES/SD_example_data_logger.spin2 "${DEST}/src/EXAMPLES/"
          cp src/EXAMPLES/SD_example_directory_walk.spin2 "${DEST}/src/EXAMPLES/"
          cp src/EXAMPLES/SD_example_multicog.spin2 "${DEST}/src/EXAMPLES/"

          # src/UTILS/ - utility programs and support libraries
          mkdir -p "${DEST}/src/UTILS"
          cp .release/src/UTILS/README.md "${DEST}/src/UTILS/README.md"
          cp src/UTILS/SD_format_card.spin2 "${DEST}/src/UTILS/"
          cp src/UTILS/isp_format_utility.spin2 "${DEST}/src/UTILS/"
          cp src/UTILS/SD_card_characterize.spin2 "${DEST}/src/UTILS/"
          cp src/UTILS/SD_performance_benchmark.spin2 "${DEST}/src/UTILS/"
          cp src/UTILS/SD_FAT32_audit.spin2 "${DEST}/src/UTILS/"
          cp src/UTILS/SD_FAT32_fsck.spin2 "${DEST}/src/UTILS/"
          cp src/UTILS/isp_fsck_utility.spin2 "${DEST}/src/UTILS/"
          cp src/UTILS/isp_string_fifo.spin2 "${DEST}/src/UTILS/"
          cp src/UTILS/SD_card_identify.spin2 "${DEST}/src/UTILS/"

          # src/regression-tests/ - test suites and framework
          mkdir -p "${DEST}/src/regression-tests"
          cp src/regression-tests/README.md "${DEST}/src/regression-tests/"
          cp src/regression-tests/THEORY-OF-OPERATIONS.md "${DEST}/src/regression-tests/"
          cp src/regression-tests/SD_RT_*_tests.spin2 "${DEST}/src/regression-tests/"
          cp src/regression-tests/isp_rt_utilities.spin2 "${DEST}/src/regression-tests/"

          # Remove any macOS artifacts
          find "${DEST}" -name '.DS_Store' -delete

          # Create zip
          zip -r "${DEST}.zip" "${DEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.TAG }}
          body: ${{ steps.changelog.outputs.NOTES }}
          files: ${{ steps.version.outputs.FOLDER_NAME }}.zip
          draft: false
          prerelease: false
